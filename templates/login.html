<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-blue-500 to-purple-600 flex justify-center items-center h-screen">

<div class="bg-black backdrop-blur-lg p-8 rounded-2xl shadow-lg w-80 text-center">
    <h2 class="text-2xl font-bold text-white mb-6">Login</h2>

    <form method="POST">
        <input name="username" placeholder="Username"
        class="w-full p-2 mb-4 rounded-lg bg-white/20 text-white placeholder-white outline-none" required>

        <input name="password" type="password" placeholder="Password"
        class="w-full p-2 mb-4 rounded-lg bg-white/20 text-white placeholder-white outline-none" required>

        <button class="w-full bg-blue-500 hover:bg-blue-600 text-white p-2 rounded-lg">
            Login
        </button>
    </form>

    <p class="text-white mt-4">
        Don't have account?
        <a href="/signup" class="text-yellow-300">Signup</a>
    </p>
</div>

</body>
</html>
