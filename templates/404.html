<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-500 to-blue-500 flex items-center justify-center h-screen">
    <div class="text-center">
        <h1 class="text-9xl font-extrabold text-red-500 mb-4">404</h1>
        <h2 class="text-3xl font-semibold mb-2 text-white">Oops! Page Not Found</h2>
        <p class="text-white mb-6">Sorry, the page you are looking for does not exist.</p>
        <a href="/" class="inline-block bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">Go Back Home</a>
    </div>
</body>
</html>
